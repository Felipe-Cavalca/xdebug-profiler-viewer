name: Attach VSIX to GitHub Release

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: 1.2.3 or v1.2.3-4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload-vsix:
    name: Build and upload VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve tag and version
        id: meta
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          RAW_TAG="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "${RAW_TAG}" ]; then
            echo "Tag not found in release event or workflow input."
            exit 1
          fi

          TAG="${RAW_TAG#refs/tags/}"
          VERSION="${TAG#v}"
          PACKAGE_VERSION="${VERSION%%-*}"

          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag/version format: ${TAG}"
            echo "Expected formats: 1.2.3, v1.2.3, 1.2.3-4, v1.2.3-beta.1"
            exit 1
          fi
          if ! [[ "${PACKAGE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package version extracted from tag: ${PACKAGE_VERSION}"
            exit 1
          fi

          VSIX_NAME="xdebug-profiler-viewer-${TAG}.vsix"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "package_version=${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "vsix_name=${VSIX_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Set package version from tag
        run: npm version "${{ steps.meta.outputs.package_version }}" --no-git-tag-version --allow-same-version

      - name: Build VSIX package
        run: npx @vscode/vsce package --out "${{ steps.meta.outputs.vsix_name }}"

      - name: Upload VSIX to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VSIX_NAME: ${{ steps.meta.outputs.vsix_name }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" "${VSIX_NAME}" --clobber
